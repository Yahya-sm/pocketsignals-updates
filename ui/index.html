<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>PocketSignals</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
<script>
  // Errors while the app starts (before app.js is loaded) – shown in the status line and the connection log.
  window.__bootErrors = [];
  window.addEventListener('error', function (e) { window.__bootErrors.push((e.message || 'Fehler') + (e.lineno ? ' (Zeile ' + e.lineno + ')' : '')); });
</script>
</head>
<body>
<header id="bar">
  <div class="brand">
    <img src="icon.png" alt="" class="logo">
    <div><b>PocketSignals</b><div class="sub"><span class="dot" id="dot"></span><span id="statusline" data-i18n="connecting"></span></div></div>
  </div>
  <button class="bgbtn" id="bgBtn" hidden></button>
  <div class="langs" id="langs"><button data-lang="de">DE</button><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
  <div class="winctl" id="winctl" hidden>
    <button data-cmd="opacity" data-i18n-title="w_opacity">◐</button>
    <button data-cmd="pin" id="pinBtn" class="on" data-i18n-title="w_pin">📌</button>
    <button data-cmd="mini" data-i18n-title="w_mini">▭</button>
    <button data-cmd="min" data-i18n-title="w_min">–</button>
    <button data-cmd="close" data-i18n-title="w_close">✕</button>
  </div>
  <span class="mode" id="mode"></span>
  <button class="gearbtn" data-tab="settings" data-i18n-title="tab_settings">⚙</button>
</header>

<div id="mini"></div>

<main>
  <section id="signals" class="tab active">
    <div id="labTop"></div>
    <div class="labgrid"><div class="labmain">
    <div class="chips" id="labFilters"></div>
    <div id="stats" class="stats"></div>
    <div class="chips" id="dirFilter">
      <button class="chip active" data-dir="all" data-i18n="all"></button>
      <button class="chip" data-dir="CALL">▲ CALL</button>
      <button class="chip" data-dir="PUT">▼ PUT</button>
      <span class="spacer"></span>
    </div>
    <div id="loginBox" class="login" hidden>
      <b data-i18n="login_title"></b>
      <p data-i18n="login_text"></p>
      <button class="btn wide" id="loginBtn" data-i18n="login_btn"></button>
    </div>
    <button id="newPill" hidden></button>
    <div id="live"></div>
    <div class="empty" id="liveEmpty">
      <div class="radar"></div>
      <p data-i18n="waiting"></p>
      <small id="nextScan"></small>
    </div>
    <div id="labWait"></div>
    <div id="labNoSig"></div>
    </div><aside id="labSide"></aside></div>
  </section>

  <section id="catalog" class="tab"><h3 data-i18n="cat_title"></h3><div id="catalogBox"></div></section>
  <section id="backtest" class="tab"><h3 data-i18n="bt_tab_title"></h3><div id="btBox"></div></section>
  <section id="risk" class="tab"><h3 data-i18n="risk_title"></h3><div id="riskBox"></div></section>

  <section id="history" class="tab">
    <div id="labJournal"></div>
    <div class="chips"><button class="chip active" data-hist="mine" data-i18n="my_trades"></button><button class="chip" data-hist="list" data-i18n="history"></button><button class="chip" data-hist="stats" data-i18n="stats_by_strategy"></button><button class="chip" data-hist="all" data-i18n="all_stats"></button><button class="chip" data-hist="archive" data-i18n="bot_archive"></button></div>
    <div id="allStats" hidden></div>
    <div id="hist"></div>
    <div id="stratStats" hidden></div>
    <div id="myStats" hidden></div>
    <div id="archStats" hidden></div>
    <button class="btn ghost wide" id="clearBtn" data-i18n="clear_history"></button>
  </section>

  <section id="settings" class="tab">
    <details class="setfold"><summary><h3 data-i18n="general"></h3></summary>
    <div class="group">
      <label class="row"><span data-i18n="language"></span>
        <select id="sLang"><option value="de">Deutsch</option><option value="ru">Русский</option><option value="en">English</option></select></label>
      <label class="row"><span data-i18n="signals_on"></span><input type="checkbox" class="sw" id="sOn"></label>
      <label class="row"><span data-i18n="sound"></span><input type="checkbox" class="sw" id="sSound"></label>
      <label class="row"><span><span data-i18n="show_m5"></span><small data-i18n="show_m5_hint"></small></span><input type="checkbox" class="sw" id="sM5"></label>
      <div class="row trendtfs"><span data-i18n="trend_tf"></span>
        <div class="tfs"><label><input type="checkbox" data-trendtf value="M1"><span>M1</span></label><label><input type="checkbox" data-trendtf value="M2"><span>M2</span></label><label><input type="checkbox" data-trendtf value="M3"><span>M3</span></label><label><input type="checkbox" data-trendtf value="M5"><span>M5</span></label><label><input type="checkbox" data-trendtf value="M10"><span>M10</span></label><label><input type="checkbox" data-trendtf value="M15"><span>M15</span></label><label><input type="checkbox" data-trendtf value="M30"><span>M30</span></label></div></div>
      <label class="row"><span><span data-i18n="trend_filter"></span><small data-i18n="trend_filter_hint"></small></span><input type="checkbox" class="sw" id="sTrendFilter"></label>
      <label class="row" id="poClickRow" hidden style="display:none"><span><span data-i18n="po_click"></span><small data-i18n="po_click_hint"></small></span><input type="checkbox" class="sw" id="sPoClick"></label>
      <label class="row" id="miniRow" hidden style="display:none"><span><span data-i18n="mini"></span><small data-i18n="mini_hint"></small></span><input type="checkbox" class="sw" id="sMini"></label>
      <label class="row miniOpt" hidden><span data-i18n="mini_count"></span>
        <select id="sMiniCount"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
      <label class="row miniOpt" hidden><span><span data-i18n="mini_pos"></span><small data-i18n="mini_pos_hint"></small></span>
        <select id="sMiniPos">
          <option value="tr" data-i18n="pos_tr"></option><option value="tl" data-i18n="pos_tl"></option><option value="tc" data-i18n="pos_tc"></option>
          <option value="br" data-i18n="pos_br"></option><option value="bl" data-i18n="pos_bl"></option><option value="bc" data-i18n="pos_bc"></option>
          <option value="custom" data-i18n="pos_custom"></option>
        </select></label>
      <label class="row"><span><span data-i18n="po_start"></span><small id="poLastInfo"></small></span>
        <select id="sPoStart"><option value="last" data-i18n="po_last"></option><option value="demo" data-i18n="po_demo"></option><option value="real" data-i18n="po_real"></option></select></label>
      <label class="row" id="tvRow" hidden><span><span data-i18n="tv_open"></span><small data-i18n="tv_open_hint"></small></span>
        <select id="sTvOpen"><option value="external" data-i18n="tv_external"></option><option value="app" data-i18n="tv_inapp"></option></select></label>
      <label class="row" id="autoRow"><span><span data-i18n="auto_po"></span><small data-i18n="auto_po_hint"></small></span><input type="checkbox" class="sw" id="sAuto"></label>
      <label class="row"><span><span data-i18n="quick_trade"></span><small data-i18n="quick_trade_hint"></small></span><input type="checkbox" class="sw" id="sQuick"></label>
      <label class="row"><span><span data-i18n="mini_tf"></span><small data-i18n="mini_tf_hint"></small></span>
        <select id="sMiniTf"><option value="M1">M1</option><option value="M2">M2</option><option value="M3">M3</option><option value="M5">M5</option><option value="M15">M15</option><option value="off" data-i18n="mini_off"></option></select></label>
      <label class="row"><span><span data-i18n="quick_real"></span><small data-i18n="quick_real_hint"></small></span><input type="checkbox" class="sw" id="sQuickReal"></label>
      <label class="row"><span><span data-i18n="quotes_demo"></span><small data-i18n="quotes_demo_hint"></small></span><input type="checkbox" class="sw" id="sQuotesDemo"></label>
      <label class="row"><span><span data-i18n="mkt_level"></span><small data-i18n="mkt_level_hint"></small></span>
        <select id="sMktLevel"><option value="0" data-i18n="mkt_l0"></option><option value="1" data-i18n="mkt_l1"></option><option value="2" data-i18n="mkt_l2"></option><option value="3" data-i18n="mkt_l3"></option></select></label>
      <label class="row"><span><span data-i18n="chaos_skip"></span><small data-i18n="chaos_skip_hint"></small></span><input type="checkbox" class="sw" id="sChaos"></label>
      <label class="row"><span><span data-i18n="regime_mode"></span><small data-i18n="regime_mode_hint"></small></span>
        <select id="sRegimeMode"><option value="off" data-i18n="rm_off"></option><option value="trend" data-i18n="rm_trend"></option><option value="range" data-i18n="rm_range"></option><option value="auto" data-i18n="rm_auto"></option></select></label>
      <details class="rgset"><summary data-i18n="rg_settings"></summary>
        <label class="row"><span><span data-i18n="rg_adx"></span><small data-i18n="rg_adx_hint"></small></span><input type="number" step="1" min="5" max="60" data-rg="rg_adx"></label>
        <label class="row"><span><span data-i18n="rg_slope"></span><small data-i18n="rg_slope_hint"></small></span><input type="number" step="0.01" min="0" max="1" data-rg="rg_slope"></label>
        <label class="row"><span><span data-i18n="rg_dist"></span><small data-i18n="rg_dist_hint"></small></span><input type="number" step="0.5" min="0" max="20" data-rg="rg_dist"></label>
        <label class="row"><span><span data-i18n="rg_range_adx"></span><small data-i18n="rg_range_adx_hint"></small></span><input type="number" step="1" min="5" max="60" data-rg="rg_range_adx"></label>
        <label class="row"><span><span data-i18n="rg_chaos_atr"></span><small data-i18n="rg_chaos_atr_hint"></small></span><input type="number" step="0.1" min="0" max="10" data-rg="rg_chaos_atr"></label>
        <label class="row"><span><span data-i18n="rg_spike"></span><small data-i18n="rg_spike_hint"></small></span><input type="number" step="0.5" min="0" max="20" data-rg="rg_spike"></label>
        <label class="row"><span><span data-i18n="rg_vol"></span><small data-i18n="rg_vol_hint"></small></span><input type="number" step="0.1" min="0" max="3" data-rg="rg_vol"></label>
      <button class="chip" id="rgReset" data-i18n="rg_reset"></button>
      </details>
      <label class="row"><span><span data-i18n="scan_every"></span><small data-i18n="scan_every_hint"></small></span>
        <select id="sInterval"><option value="5">5 s</option><option value="10">10 s</option><option value="15">15 s</option><option value="20">20 s</option><option value="30">30 s</option><option value="60">60 s</option></select></label>
      <label class="row"><span data-i18n="min_strength"></span><input type="number" id="sMin" min="0" max="99"></label>
      <label class="row"><span data-i18n="max_per_min"></span><input type="number" id="sMax" min="1" max="20"></label>
      <label class="row"><span data-i18n="min_payout"></span><input type="number" id="sPayout" min="0" max="100"></label>
    </div>
    </details>
    <details class="setfold"><summary><h3 data-i18n="markets"></h3></summary>
    <div class="group" id="cats"></div>
    </details>
    <details class="setfold"><summary><h3><span data-i18n="strategies"></span> <span id="stratCount"></span></h3></summary>
    <input type="search" id="stratSearch" data-i18n-ph="strat_search">
    <div class="chips"><button class="chip active" data-filter="all" data-i18n="all"></button><button class="chip" data-filter="on" data-i18n="active"></button></div>
    <div id="strats"></div>
    </details>
    <details class="setfold"><summary><h3 data-i18n="why_title"></h3></summary><div id="whyBox"></div></details>
    <details class="setfold"><summary><h3 data-i18n="transfer"></h3></summary>
    <p class="hint" data-i18n="transfer_hint"></p>
    <input type="file" id="importFile" accept=".json,.txt,application/json,text/plain" hidden>
    <textarea id="importText" rows="3" placeholder='{"strategies": [...], "strategy_settings": {...}}'></textarea>
    <div class="btnrow">
      <button class="btn ghost" id="importPick" data-i18n="pick_file"></button>
      <button class="btn" id="importBtn" data-i18n="import"></button>
      <button class="btn ghost" id="exportBtn" data-i18n="export"></button>
    </div>
    </details>
    <details class="setfold"><summary><h3 data-i18n="po_session"></h3></summary>
    <p class="hint" id="sessionHint" data-i18n="session_hint"></p>
    <textarea id="ssid" rows="3" placeholder='42["auth",{"session":"…","isDemo":1,…}]'></textarea>
    <button class="btn wide" id="ssidBtn" data-i18n="save_session"></button>
    <p class="session-info" id="sessionInfo"></p>
    <div id="exportBox" hidden>
      <button class="btn ghost wide" id="exportSessionBtn" data-i18n="export_session"></button>
      <p class="hint" data-i18n="export_session_hint"></p>
    </div>
    </details>
    <details class="setfold"><summary><h3 data-i18n="otc_rec"></h3></summary>
      <label class="row"><span><span data-i18n="otc_rec_on"></span><small data-i18n="otc_rec_hint"></small></span><input type="checkbox" class="sw" id="sOtcRec"></label>
      <p class="hint" id="otcRecInfo"></p>
      <button class="btn ghost wide" id="otcExportBtn" hidden data-i18n="otc_export"></button>
    </details>
    <details class="setfold"><summary><h3 data-i18n="conn_log"></h3></summary>
    <pre id="connLog" class="connlog"></pre>
    <button class="btn ghost wide" id="copyLogBtn" data-i18n="copy_log"></button>
    </details>
    <div id="updateBox" hidden>
      <details class="setfold"><summary><h3 data-i18n="update"></h3></summary>
      <p class="hint"><span data-i18n="version"></span> <b id="appVersion"></b> <span id="onlineStatus"></span></p>
      <button class="btn wide" id="checkBtn" data-i18n="check_btn"></button>
      <button class="btn wide" id="installBtn" hidden></button>
      <p class="hint" data-i18n="update_hint"></p>
      <button class="btn ghost wide" id="updateBtn" data-i18n="update_btn"></button>
      </details>
    </div>
    <div id="lanBox">
      <details class="setfold"><summary><h3 data-i18n="phone_wifi"></h3></summary>
      <p class="hint" data-i18n="phone_wifi_hint"></p>
      <div id="lan"></div>
      </details>
    </div>
  </section>
</main>

<nav id="tabs">
  <button class="active" data-tab="signals"><span>⚡</span><b data-i18n="tab_signals"></b><i id="liveCount"></i></button>
  <button data-tab="catalog"><span>☰</span><b data-i18n="tab_catalog"></b></button>
  <button data-tab="backtest"><span>↺</span><b data-i18n="tab_backtest"></b></button>
  <button data-tab="history"><span>🕘</span><b data-i18n="tab_journal"></b></button>
  <button data-tab="risk"><span>⛨</span><b data-i18n="tab_risk"></b></button>
  <button data-tab="settings"><span>⚙</span><b data-i18n="tab_settings"></b></button>
</nav>

<div id="toast"></div>
<script src="i18n.js"></script>
<script src="sounds.js"></script>
<script src="bot_stats.js"></script>
<script src="i18n-lab.js"></script>
<script src="app.js"></script>
<script src="lab-ui.js"></script>
</body>
</html>
